<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tela de Login do Aether</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="login.css">

    <link rel="icon" href="Imagens/LogoAether.svg" type="image/svg">

</head>
<body>

    <div></div>
    <div></div>
    <div></div>
    <div></div>

    <div>
    <img src="Imagens/AekoLogoEmBaixo.svg" alt="Logo Aether">
    <p>Pense no presente e mude seu <span>futuro</span></p>
    </div>

    <div>

        <img src="Imagens/AekoLogin.svg" alt="Aeko">

        <fieldset>
            <form action="login" method="post">

                <label for="empresa"></label>
                <select name="empresas" id="empresa" >
                    <option value="" disabled selected hidden>Selecionar</option>
                    <option value="jbs">JBS</option>
                    <option value="friboi">Friboi</option>
                    <option value="seara">Seara</option>
                </select>

                <input type="text" id="nome" name="campoNome" placeholder="nome">
                <label for="nome"></label>

                <input type="email" id="email" name="campoEmail" placeholder="e-mail">
                <label for="email"></label>

                <input type="password" id="senha" name="campoSenha" placeholder="senha">
                <label for="senha"></label>


                <button type="submit" value="EnviarFormulárioLogin">Entrar</button>

            </form>
        </fieldset>

            <p>Não possui uma conta? <a href="cadastroEmpresarial.html">clique aqui</a></p>
            <p><a href="recuperarSenha.html">Esqueci a senha</a></p>


    </div>


</body>
</html>
