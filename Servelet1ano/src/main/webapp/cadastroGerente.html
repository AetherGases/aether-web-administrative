<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tela de Cadastro de Gerente do Aether</title>
</head>
<body>

<div></div>
<div></div>
<div></div>
<div></div>

<div>
    <img src="Imagens/AekoLogoEmBaixo.svg" alt="Logo Aether">
    <p>Pense no presente e mude seu <span>futuro</span></p>
</div>

<div>

    <img src="Imagens/AekoLogin.svg" alt="Aeko">
    <div>Cadastro de gerente</div>

    <fieldset>
        <form action="gerente" method="post">

            <input type="text" id="nome" name="campoNome" placeholder="nome">
            <label for="nome"></label>

            <input type="email" id="email" name="campoEmail" placeholder="email">
            <label for="email"></label>

            <input type="password" id="senha" name="campoSenha" placeholder="senha">
            <label for="senha"></label>

            <input type="password" id="confirmarSenha" name="campoConfirmarSenha" placeholder="confirmarSenha">
            <label for="confirmarSenha"></label>

            <label for="empresa"></label>
            <select name="empresas" id="empresa" >
                <option value="" disabled selected hidden>Selecionar</option>
                <option value="jbs">JBS</option>
                <option value="friboi">Friboi</option>
                <option value="seara">Seara</option>
            </select>

            <input type="text" id="cpf" name="campoCPF" placeholder="CPF">
            <label for="cpf"></label>

            <button type="submit" value="EnviarFormulárioCadastroGerente">Entrar</button>

        </form>
    </fieldset>

    <p>Já possui uma conta? <a href="login.html">clique aqui</a></p>

</div>


</body>
</html>
